add_prepaid_credit:
  name: Add prepaid credit
  description: Add an amount to the prepaid meter balance (after buying power).
  fields:
    entry_id:
      name: Config entry ID
      description: The entry_id of the integration instance.
      required: true
      selector:
        text:
    amount:
      name: Amount
      description: Credit amount to add (in the configured currency).
      required: true
      selector:
        number:
          min: 0
          step: 0.01
          mode: box

set_prepaid_balance:
  name: Set prepaid balance
  description: Set the absolute prepaid balance (e.g. after a full top-up).
  fields:
    entry_id:
      name: Config entry ID
      description: The entry_id of the integration instance.
      required: true
      selector:
        text:
    amount:
      name: Amount
      description: New absolute balance.
      required: true
      selector:
        number:
          min: 0
          step: 0.01
          mode: box

reset_billing_cycle:
  name: Reset billing cycle
  description: Force a reset of the cycle consumption baseline.
  fields:
    entry_id:
      name: Config entry ID
      description: The entry_id of the integration instance.
      required: true
      selector:
        text:
